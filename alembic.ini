[alembic]
# path to migration scripts
script_location = migrations

# Asegura que `app` sea importable cuando Alembic corre desde la raíz.
prepend_sys_path = .

# database url: se completa en tiempo de ejecución desde app.core.config
# (variables de entorno / .env). No se hardcodean credenciales acá.
sqlalchemy.url =

# version location (por defecto: <script_location>/versions)

# timezone to use when rendering the date
# within the migration file as well as the filename.
# string value is expected to be from timezone library i.e.
#   america/new_york, europe/berlin, ...
# If blank, uses local timezone of the machine.
# prepend '+' for UTC.
# timezone =

# max length of characters to apply to the
# "version" column
# version_length = 48

# the format string used to generate version ids
# version_id_format = %Y%m%d_%H%M%S

# the naming style used to generate version ids
# version_naming_style = "timestamp"

[post_write_hooks]
# post_write_hooks defines scripts or Python functions that are run
# on newly generated migration scripts.  See the documentation for further
# detail and examples

# format using "black" - the Python code formatter
# hooks = black
# black.type = console_application
# black.executable = black
# black.options = -l 79 REVISION_SCRIPT_FILENAME

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
